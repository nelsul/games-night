# Production on the VPS. Values come from .env (written by the deploy workflow).
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3300:8080"
    environment:
      DATABASE_URL: postgres://gamesnight:${POSTGRES_PASSWORD}@db:5432/gamesnight
      PUBLIC_URL: ${PUBLIC_URL}
      COOKIE_SECURE: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-games-night}
      S3_USE_SSL: "true"
      S3_REGION: auto

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamesnight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gamesnight
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamesnight -d gamesnight"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db:
