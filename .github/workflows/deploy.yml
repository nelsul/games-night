name: Deploy

# Every merge into main deploys to gamesnight.nelsul.com.
# Secrets live in the "production" environment, which only protected branches (main) can use,
# so workflows from pull requests and forks never see them.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gamesnight.nelsul.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write .env from secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          umask 077
          # S3 is optional: without it the app runs with profile photos turned off.
          for v in POSTGRES_PASSWORD SMTP_HOST SMTP_USER SMTP_PASS MAIL_FROM; do
            [ -n "${!v}" ] || { echo "::error::secret $v is empty"; exit 1; }
          done
          {
            echo "PUBLIC_URL=https://gamesnight.nelsul.com"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}"
            printf 'SMTP_USER=%s\n' "$SMTP_USER"
            printf 'SMTP_PASS=%s\n' "$SMTP_PASS"
            printf 'MAIL_FROM=%s\n' "$MAIL_FROM"
            if [ -n "$S3_ENDPOINT" ] && [ -n "$S3_ACCESS_KEY" ] && [ -n "$S3_SECRET_KEY" ]; then
              printf 'S3_ENDPOINT=%s\n' "$S3_ENDPOINT"
              printf 'S3_ACCESS_KEY=%s\n' "$S3_ACCESS_KEY"
              printf 'S3_SECRET_KEY=%s\n' "$S3_SECRET_KEY"
              printf 'S3_BUCKET=%s\n' "${S3_BUCKET:-games-night}"
            fi
          } > .env

      - name: Set up SSH (pinned host key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The deploy key is locked on the server to one script (~/bin/deploy-games-night) that
      # unpacks this bundle into ~/apps/games-night and runs `docker compose up -d --build`.
      - name: Ship and rebuild on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tar -czf - \
            --exclude=.git --exclude=node_modules --exclude=web/.svelte-kit --exclude=web/build \
            --exclude=docker-compose.dev.yml --exclude=dev.sh \
            .env Dockerfile docker-compose.yml api web \
          | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 "claude@${DEPLOY_HOST}"

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://gamesnight.nelsul.com/api/health | grep -q '"ok"' \
              && curl -fsS https://gamesnight.nelsul.com/entrar | grep -q "<title>Games Night</title>"; then
              echo "gamesnight.nelsul.com is up"; exit 0
            fi
            sleep 6
          done
          echo "::error::site did not come back after deploy"; exit 1

      - name: Remove secrets from the runner
        if: always()
        run: rm -f .env ~/.ssh/deploy_key
