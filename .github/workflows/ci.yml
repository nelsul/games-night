name: CI

# Runs on every pull request (both jobs are required before merging into main)
# and is reused by the deploy workflow before each deploy.
#   check: format, vet, tests (including the database isolation tests) and builds.
#   scope: the pull request is a hub change or a change to exactly one game.
on:
  pull_request:
    # edited/labeled: the scope check reads the title and labels.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # A throwaway Postgres for the isolation tests (api/isolation_test.go): they prove
    # each game's role can only touch its own schema.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: API format, vet and tests
        working-directory: api
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w ."; exit 1; }
          go vet ./...
          go test ./...
      - name: Web install
        working-directory: web
        run: npm ci
      - name: Web type check (svelte-check)
        working-directory: web
        run: npm run check
      - name: Web build
        working-directory: web
        run: npm run build

  scope:
    name: scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Hub or one game, and isolated
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          (cd api && go build -o "$RUNNER_TEMP/scopecheck" ./cmd/scopecheck)
          "$RUNNER_TEMP/scopecheck"
